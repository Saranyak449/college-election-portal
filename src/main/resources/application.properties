spring.application.name=online-voting-management-system
server.port=8080

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/voting_db
spring.datasource.username=postgres
spring.datasource.password=Password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Auto Query & Table Creation Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Secret Key
jwt.secret=9a2f8c4e1b7d5a3f0e8c6b4a2f9d7e1c8b3a5f0e2d4c6b8a1f9e3d7c5b0a4f2e
jwt.expiration=86400000